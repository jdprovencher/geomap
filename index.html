<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find New Hampshire — US Map Minigame</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0f4f8;
    --ink: #1f2a37;
    --accent: #2563eb;
    --success: #22c55e;
    --panel: #ffffff;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
  }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .sub { font-size: 13px; color: #64748b; }
  .bar {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .stat {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 800;
    color: #475569;
  }
  .stat b { color: var(--ink); }
  main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  .map-wrap {
    position: relative;
    width: min(960px, 94vw);
    height: min(620px, 64vh);
    box-shadow: 0 24px 60px -12px rgba(15, 23, 42, 0.28);
    border-radius: 16px;
    border: 1px solid #cbd5e1;
    background: #fff;
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; cursor: default; }
  .state {
    fill: #e2e8f0;
    stroke: #fff;
    stroke-width: 3;
    stroke-linejoin: round;
    transition: fill 0.16s, filter 0.16s, transform 0.16s;
    transform-origin: 50% 50%;
    cursor: pointer;
  }
  .state:hover {
    filter: brightness(1.18);
    stroke: #94a3b8;
  }
  .state.wrong {
    fill: #ef4444;
    stroke: #b91c1c;
    animation: wrong 0.55s ease;
  }
  .state.right {
    fill: var(--success);
    stroke: #166534;
    filter: drop-shadow(0 0 8px rgba(34,197,94,0.5));
  }
  @keyframes wrong {
    0% { transform: scale(1); }
    25% { transform: scale(1.07); }
    50% { transform: scale(0.93); }
    75% { transform: scale(1.04); }
    100% { transform: scale(1); fill: #e2e8f0; stroke: #fff; }
  }
  canvas#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
  }
  .msg {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 700;
    color: #475569;
    min-height: 24px;
    text-align: center;
    transition: color 0.2s;
  }
  .msg.ok { color: var(--success); }
  .msg.bad { color: #ef4444; }
  .controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid #cbd5e1;
    color: var(--ink);
    transition: all 0.18s;
  }
  button:hover { border-color: #94a3b8; background: #f8fafc; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 12px -2px rgba(37,99,235,0.35);
  }
  button.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    gap: 14px;
    text-align: center;
    padding: 24px;
    backdrop-filter: blur(4px);
  }
  .overlay h2 { font-size: 36px; margin: 0; color: #fff; }
  .overlay p { color: #cbd5e1; font-size: 17px; margin: 0; }
  .stats { color: #94a3b8; font-size: 15px; margin-top: 6px; }
  .hidden { display: none !important; }
  .hint { font-size: 12.5px; color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Find New Hampshire</h1>
  <div class="sub">Click the state where New Hampshire is located</div>
  <div class="bar">
    <div class="stat">Time <b id="timer">0s</b></div>
    <div class="stat">Attempts <b id="attempts">0</b></div>
    <div class="stat hint">Hint: it's in the Northeast</div>
  </div>
</header>
<main>
  <canvas id="confetti"></canvas>
  <div class="map-wrap" id="mapWrap">
    <svg id="map" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
      <g id="statesLayer"></g>
    </svg>
  </div>
  <div class="msg" id="msg"></div>
  <div class="controls">
    <button id="btnReveal" type="button">Reveal Answer</button>
    <button id="btnAgain" type="button" class="primary">Play Again</button>
  </div>
</main>
<div class="overlay" id="overlay">
  <h2 id="winTitle">You found it!</h2>
  <p id="winMsg">New Hampshire</p>
  <div class="stats" id="winStats"></div>
  <button class="primary" id="btnWinAgain">Play Again</button>
</div>
<script>
(function () {
  const SX = 16.9;   // x scale: (lon + 125) * SX
  const SY = 24.0;   // y scale: (49 - lat) * SY
  const SHRINK = 0.82;
  const MIN = 20;

  // [code, name, minLon, minLat, maxLon, maxLat]
  const DATA = [
    ['WA','Washington',-124.8,45.5,-122.3,49.1],
    ['OR','Oregon',-124.6,42.0,-116.4,46.3],
    ['CA','California',-124.4,32.5,-114.1,42.0],
    ['NV','Nevada',-120.0,35.0,-114.0,42.0],
    ['ID','Idaho',-117.2,42.0,-111.0,49.1],
    ['MT','Montana',-116.0,44.4,-104.0,49.1],
    ['WY','Wyoming',-111.1,41.0,-104.0,45.0],
    ['UT','Utah',-114.1,37.0,-109.0,42.0],
    ['CO','Colorado',-109.1,37.0,-102.0,41.0],
    ['AZ','Arizona',-114.8,31.3,-109.0,37.0],
    ['NM','New Mexico',-109.1,31.3,-103.0,37.0],
    ['ND','North Dakota',-104.1,45.9,-96.6,49.1],
    ['SD','South Dakota',-104.1,42.5,-96.6,45.9],
    ['NE','Nebraska',-104.1,40.0,-95.3,43.1],
    ['KS','Kansas',-102.1,37.0,-94.6,40.0],
    ['OK','Oklahoma',-103.1,33.6,-94.4,37.1],
    ['TX','Texas',-106.7,25.8,-93.5,36.5],
    ['MN','Minnesota',-97.2,43.5,-89.5,49.1],
    ['IA','Iowa',-96.6,40.5,-90.3,43.5],
    ['MO','Missouri',-95.8,36.0,-89.1,40.6],
    ['AR','Arkansas',-94.7,33.0,-89.6,36.5],
    ['LA','Louisiana',-94.0,29.0,-88.8,33.1],
    ['WI','Wisconsin',-92.9,42.5,-86.8,47.1],
    ['IL','Illinois',-91.6,36.9,-87.5,42.5],
    ['MS','Mississippi',-91.7,30.2,-88.1,35.0],
    ['AL','Alabama',-88.5,30.2,-84.9,35.1],
    ['GA','Georgia',-85.7,30.3,-80.8,35.1],
    ['FL','Florida',-87.6,24.5,-80.0,31.0],
    ['SC','South Carolina',-83.4,32.0,-78.5,35.1],
    ['NC','North Carolina',-84.4,33.8,-75.5,36.6],
    ['TN','Tennessee',-90.4,35.0,-81.6,36.6],
    ['KY','Kentucky',-89.6,36.5,-81.9,39.1],
    ['VA','Virginia',-83.8,36.5,-75.2,39.5],
    ['WV','West Virginia',-82.7,37.2,-77.6,40.7],
    ['OH','Ohio',-84.9,38.4,-80.5,42.3],
    ['MI','Michigan',-90.4,41.7,-82.1,48.3],
    ['IN','Indiana',-88.1,37.8,-84.8,41.8],
    ['PA','Pennsylvania',-80.5,39.7,-74.7,42.3],
    ['NY','New York',-79.8,40.5,-71.8,45.1],
    ['VT','Vermont',-73.4,42.7,-71.4,45.1],
    ['NH','New Hampshire',-72.6,42.7,-70.6,45.3],
    ['ME','Maine',-71.1,43.0,-66.9,47.5],
    ['MA','Massachusetts',-73.6,41.2,-69.9,42.7],
    ['RI','Rhode Island',-71.9,41.4,-71.1,42.0],
    ['CT','Connecticut',-73.8,41.0,-71.8,42.1],
    ['NJ','New Jersey',-75.6,38.9,-73.9,41.4],
    ['DE','Delaware',-75.8,38.5,-75.0,39.8],
    ['MD','Maryland',-79.5,37.9,-75.0,39.7]
  ];

  const INSETS = {
    AK: { x: 18, y: 485, w: 158, h: 100, code: 'AK', name: 'Alaska' },
    HI: { x: 262, y: 502, w: 112, h: 56, code: 'HI', name: 'Hawaii' }
  };

  function rectFor(code, mnLa, mxLa, mnLo, mxLo) {
    // note: DATA stores [code,name,minLon,minLat,maxLon,maxLat]
    // here args are (code, minLat, maxLat, minLon, maxLon) to keep it simple below
  }

  function buildRect(entry) {
    const [code, , minLon, minLat, maxLon, maxLat] = entry;
    const cx = (minLon + maxLon) / 2;
    const cy = (minLat + maxLat) / 2;
    let w = (maxLon - minLon) * SX * SHRINK;
    let h = (maxLat - minLat) * SY * SHRINK;
    if (w < MIN) w = MIN;
    if (h < MIN) h = MIN;
    const x = (cx + 125) * SX - w / 2;
    const y = (49 - cy) * SY - h / 2;
    return { code, x, y, w, h };
  }

  const states = DATA.map(buildRect);
  // big states first (drawn underneath), small states last (drawn on top)
  states.sort((a, b) => (b.w * b.h) - (a.w * a.h));

  const layer = document.getElementById('statesLayer');
  const els = {};
  states.forEach(s => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('class', 'state');
    r.setAttribute('data-code', s.code);
    r.setAttribute('id', 'st-' + s.code);
    r.setAttribute('x', s.x);
    r.setAttribute('y', s.y);
    r.setAttribute('width', s.w);
    r.setAttribute('height', s.h);
    r.setAttribute('rx', Math.min(s.w, s.h) * 0.14);
    // deterministic pastel fill
    const hue = (s.code.charCodeAt(0) * 31 + s.code.charCodeAt(1) * 7) % 360;
    const sat = 26 + (s.code.charCodeAt(0) + s.code.charCodeAt(1)) % 14;
    const light = 80 + (s.code.charCodeAt(0) * 13) % 10;
    r.style.fill = `hsl(${hue},${sat}%,${light}%)`;
    r.style.stroke = '#fff';
    layer.appendChild(r);
    els[s.code] = r;
  });
  // insets (drawn last so they sit on top)
  Object.values(INSETS).forEach(ins => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('class', 'state');
    r.setAttribute('data-code', ins.code);
    r.setAttribute('id', 'st-' + ins.code);
    r.setAttribute('x', ins.x);
    r.setAttribute('y', ins.y);
    r.setAttribute('width', ins.w);
    r.setAttribute('height', ins.h);
    r.setAttribute('rx', 10);
    r.style.fill = '#cbd5e1';
    r.style.stroke = '#fff';
    layer.appendChild(r);
    els[ins.code] = r;
  });

  // ---------- game state ----------
  const TARGET = 'NH';
  let started = false;
  let startTime = 0;
  let attempts = 0;
  let timerId = null;
  let gameOver = false;
  let celebrating = false;
  let celebrateStop = null;

  const $timer = document.getElementById('timer');
  const $attempts = document.getElementById('attempts');
  const $msg = document.getElementById('msg');
  const $overlay = document.getElementById('overlay');
  const $winTitle = document.getElementById('winTitle');
  const $winMsg = document.getElementById('winMsg');
  const $winStats = document.getElementById('winStats');

  function fmtMs(ms) {
    const s = Math.floor(ms / 1000);
    return s + 's';
  }

  function startTimer() {
    if (timerId) return;
    startTime = Date.now();
    timerId = setInterval(() => {
      $timer.textContent = fmtMs(Date.now() - startTime);
    }, 100);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    $timer.textContent = fmtMs(Date.now() - startTime);
  }
  function resetTimer() {
    stopTimer();
    started = false;
    attempts = 0;
    $attempts.textContent = '0';
    $timer.textContent = '0s';
  }

  function setMsg(text, kind) {
    $msg.textContent = text;
    $msg.className = 'msg ' + (kind || '');
  }

  function clearStates() {
    document.querySelectorAll('.state').forEach(el => {
      el.classList.remove('wrong', 'right');
    });
  }

  function handleClick(code) {
    if (gameOver) return;
    if (!started) { started = true; startTimer(); }
    attempts++;
    $attempts.textContent = attempts;
    if (code === TARGET) {
      win();
    } else {
      const el = els[code];
      el.classList.add('wrong');
      setMsg('Not New Hampshire — try again!', 'bad');
      setTimeout(() => el.classList.remove('wrong'), 560);
    }
  }

  layer.addEventListener('click', (e) => {
    const r = e.target.closest('.state');
    if (!r) return;
    handleClick(r.getAttribute('data-code'));
  });

  // ---------- confetti ----------
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let width, height;
  const particles = [];
  let rafId = null;
  let running = false;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#fbbf24','#f472b6','#a78bfa','#34d399','#22d3ee','#f87171','#facc15','#818cf8','#e879f9'];

  function burst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 9;
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        gravity: 0.22,
        life: 50 + Math.random() * 70,
        maxLife: 0,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        size: 4 + Math.random() * 7,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2
      });
    }
    particles.forEach(p => { p.maxLife = p.life; });
    if (!running) {
      running = true;
      animate();
    }
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);
    let alive = 0;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.985;
      p.rot += p.vr;
      p.life--;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      alive++;
      const a = p.life / p.maxLife;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
    if (alive > 0 && running) {
      rafId = requestAnimationFrame(animate);
    } else {
      running = false;
      rafId = null;
    }
  }

  function stopConfetti() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    particles.length = 0;
    ctx.clearRect(0, 0, width, height);
    celebrating = false;
    if (celebrateStop) { clearInterval(celebrateStop); celebrateStop = null; }
  }

  function win() {
    gameOver = true;
    stopTimer();
    const nh = els[TARGET];
    nh.classList.add('right');
    setMsg('You found New Hampshire! 🎉', 'ok');

    // burst on top of New Hampshire
    const rect = nh.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    burst(cx, cy, 160);

    celebrating = true;
    let bursts = 0;
    celebrateStop = setInterval(() => {
      if (!celebrating) return;
      burst(Math.random() * width, 0, 18);
      bursts++;
      if (bursts >= 10) stopCelebrationRain();
    }, 320);

    setTimeout(() => {
      $winStats.textContent = 'Time: ' + $timer.textContent + '   •   Attempts: ' + attempts;
      $overlay.classList.remove('hidden');
    }, 700);
  }
  function stopCelebrationRain() {
    celebrating = false;
    if (celebrateStop) { clearInterval(celebrateStop); celebrateStop = null; }
  }

  function reveal() {
    if (gameOver) return;
    gameOver = true;
    stopTimer();
    els[TARGET].classList.add('right');
    $winTitle.textContent = "It's New Hampshire";
    $winMsg.textContent = 'You gave up — here it is.';
    $winStats.textContent = 'Attempts: ' + attempts + '   •   Time: ' + $timer.textContent;
    $overlay.classList.remove('hidden');
  }

  function resetGame() {
    stopConfetti();
    stopCelebrationRain();
    stopTimer();
    gameOver = false;
    started = false;
    attempts = 0;
    $attempts.textContent = '0';
    $timer.textContent = '0s';
    setMsg('', '');
    clearStates();
    $overlay.classList.add('hidden');
  }

  document.getElementById('btnAgain').addEventListener('click', resetGame);
  document.getElementById('btnWinAgain').addEventListener('click', resetGame);
  document.getElementById('btnReveal').addEventListener('click', reveal);
  $overlay.addEventListener('click', (e) => { if (e.target === $overlay) resetGame(); });
})();
</script>
</body>
</html>
